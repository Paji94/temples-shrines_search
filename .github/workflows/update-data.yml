# 全国の寺社データ（data/）を OpenStreetMap から作り直し、変更があればコミットする
name: 寺社データを更新

on:
  schedule:
    - cron: '17 18 * * 0'   # 毎週月曜 3:17（日本時間）
  workflow_dispatch:         # Actions 画面の「Run workflow」から手動実行
  push:
    branches: [main]
    paths:                   # 取得処理を変えたときは、マージ後に自動で作り直す
      - 'scripts/build-data.mjs'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 寺社データを取得してタイルに分割
        run: node scripts/build-data.mjs

      - name: 変更があればコミット
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "寺社データを更新（$(date -u +%Y-%m-%d)）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages を再公開
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
