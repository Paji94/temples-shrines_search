<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寺社データ取得テスト</title>
<style>
  :root { --bg:#f7f5f0; --card:#fff; --ink:#222; --muted:#777; --line:#e3ded3; --accent:#b23a2b; --shrine:#c0392b; --temple:#6b4f2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  header { background:var(--accent); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.85; }
  main { max-width:900px; margin:0 auto; padding:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; padding:8px; border:1px solid var(--line); background:#faf8f4; border-radius:8px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; padding:8px; font-size:15px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .row { display:flex; gap:8px; } .row > div { flex:1; min-width:0; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .presets button { font-size:12px; padding:4px 8px; border-radius:999px; border:1px solid var(--line); background:#fff; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .actions button { padding:10px 14px; font-size:14px; border-radius:8px; border:none; background:var(--accent); color:#fff; }
  .actions button.sub { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .actions button:disabled { opacity:.4; }
  #status { font-size:13px; color:var(--muted); margin-top:10px; min-height:1.2em; white-space:pre-wrap; }
  #status.err { color:#c00; background:#fff0f0; padding:8px; border-radius:6px; }
  #stats { font-size:13px; margin-bottom:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; color:#fff; margin-right:6px; vertical-align:2px; }
  .badge.shinto { background:var(--shrine); } .badge.buddhist { background:var(--temple); }
  .meta { font-size:12px; color:var(--muted); line-height:1.6; }
  .meta a { color:var(--accent); }
  .missing { color:#c00; }
  .wiki { margin-top:6px; padding:8px; background:#faf8f4; border-radius:6px; font-size:13px; line-height:1.6; }
  .conf { font-size:11px; padding:0 5px; border-radius:3px; border:1px solid currentColor; margin-left:4px; }
  .conf.high { color:#1a7f37; } .conf.medium { color:#b26b00; } .conf.low { color:#c00; }
  details { margin-top:6px; } summary { font-size:12px; color:var(--muted); cursor:pointer; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; background:#f1eee7; padding:8px; border-radius:6px; max-height:300px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>⛩️ 寺社データ取得テスト</h1>
  <p>Overpass API（OSM）＋ Wikipedia / Wikidata ／ APIキー不要</p>
</header>
<main>
  <div class="panel">
    <div class="tabs">
      <button id="tabPref" class="on">都道府県で検索</button>
      <button id="tabGeo">緯度経度の周辺</button>
    </div>

    <div id="prefBox">
      <label>都道府県</label>
      <select id="pref"></select>
    </div>

    <div id="geoBox" hidden>
      <div class="row">
        <div><label>緯度</label><input id="lat" inputmode="decimal" value="34.9949"></div>
        <div><label>経度</label><input id="lon" inputmode="decimal" value="135.7850"></div>
      </div>
      <label>半径（メートル）</label>
      <input id="radius" type="number" value="1000" min="50" max="20000" step="50">
      <div class="presets">
        <button data-ll="34.9949,135.7850">京都・清水寺</button>
        <button data-ll="35.7148,139.7967">浅草寺</button>
        <button data-ll="34.4550,136.7256">伊勢神宮内宮</button>
        <button data-ll="35.3197,139.5503">鎌倉・鶴岡八幡宮</button>
        <button id="here">📍 現在地</button>
      </div>
    </div>

    <div class="row">
      <div>
        <label>種別</label>
        <select id="kind">
          <option value="all">神社＋寺院</option>
          <option value="shinto">神社のみ</option>
          <option value="buddhist">寺院のみ</option>
        </select>
      </div>
      <div><label>最大件数</label><input id="limit" type="number" value="50" min="1" max="2000"></div>
    </div>

    <div class="actions">
      <button id="btnSearch">① 検索</button>
      <button id="btnAddr" class="sub" disabled>② 住所を補完</button>
      <button id="btnWiki" class="sub" disabled>③ Wikipediaで補完</button>
      <button id="btnCopy" class="sub" disabled>JSONをコピー</button>
    </div>
    <div id="status" class="err">画面のプログラムが動いていません。ファイルのプレビューではなく、Safari や Chrome で開いてください。</div>
  </div>

  <div id="stats"></div>
  <div id="list"></div>
</main>

<script type="module">
/**
 * temple-api.js — 全国の寺社仏閣データ取得モジュール
 *
 * 使うのは無料・APIキー不要のAPIだけです。
 *   - Overpass API (OpenStreetMap) … 神社・寺院の名称 / 緯度経度 / 住所タグ
 *   - Nominatim (OpenStreetMap)    … 住所タグが無いときの逆ジオコーディング（任意・1秒1件まで）
 *   - Wikipedia API (ja)           … 概要文
 *   - Wikidata API                 … 宗派（P140: 宗教・宗派）
 *
 * ブラウザでも Node.js 18 以降でも動きます（標準の fetch を使用）。
 *
 * 主な関数
 *   searchTemplesByPrefecture('京都府', { kind: 'buddhist', limit: 100 })
 *   searchTemplesNearby(35.0116, 135.7681, { radius: 1000 })
 *   fillMissingAddresses(places)   // 住所の無いものを Nominatim で補完
 *   enrichPlaces(places)           // Wikipedia / Wikidata で概要文・宗派を補完
 */

// ─────────────────────────────────────────────
// 設定
// ─────────────────────────────────────────────
const CONFIG = {
  overpassEndpoints: [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
  ],
  nominatimEndpoint: 'https://nominatim.openstreetmap.org/reverse',
  wikipediaApi: 'https://ja.wikipedia.org/w/api.php',
  wikidataApi: 'https://www.wikidata.org/w/api.php',
  // Nominatim の利用規約: 1秒に1リクエストまで
  nominatimIntervalMs: 1100,
  // Node.js から使う場合は連絡先入りの User-Agent を設定してください（ブラウザでは無視されます）
  userAgent: 'TempleSearchApp/0.1 (contact: you@example.com)',
  requestTimeoutMs: 30000,
  // 都道府県全体の検索は1分以上かかることがあるので Overpass だけ長めに待つ
  overpassTimeoutMs: 150000,
};

const IS_BROWSER = typeof window !== 'undefined';

// ─────────────────────────────────────────────
// 都道府県（OSM の ISO3166-2 タグで検索する）
// ─────────────────────────────────────────────
const PREFECTURES = [
  '北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県',
  '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県',
  '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県',
  '静岡県', '愛知県', '三重県', '滋賀県', '京都府', '大阪府', '兵庫県',
  '奈良県', '和歌山県', '鳥取県', '島根県', '岡山県', '広島県', '山口県',
  '徳島県', '香川県', '愛媛県', '高知県', '福岡県', '佐賀県', '長崎県',
  '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県',
].map((name, i) => ({ name, code: `JP-${String(i + 1).padStart(2, '0')}` }));

/** '京都府' / '京都' / 26 / 'JP-26' のどれでも都道府県を特定する */
function resolvePrefecture(input) {
  if (input == null) return null;
  const s = String(input).trim();
  if (/^JP-\d{2}$/i.test(s)) return PREFECTURES.find((p) => p.code === s.toUpperCase()) || null;
  if (/^\d{1,2}$/.test(s)) return PREFECTURES[Number(s) - 1] || null;
  return (
    PREFECTURES.find((p) => p.name === s) ||
    // 「京都」「東京」「北海道」のように末尾の都道府県を省いた入力にも対応
    PREFECTURES.find((p) => p.name === s + '都' || p.name === s + '道' || p.name === s + '府' || p.name === s + '県') ||
    null
  );
}

// ─────────────────────────────────────────────
// 共通ユーティリティ
// ─────────────────────────────────────────────
// 一部の環境（Claude アプリのプレビュー画面など）では fetch に AbortSignal を渡すと
// "The object can not be cloned" エラーになる。その場合は signal なしで再実行し、
// タイムアウトは Promise.race で代用する。
let signalUnsupported = false;

function isCloneError(e) {
  return e && (e.name === 'DataCloneError' || /can ?not be cloned|could not be cloned/i.test(e.message || ''));
}

async function fetchJSON(url, init = {}) {
  const timeoutMs = init.timeoutMs || CONFIG.requestTimeoutMs;
  const host = new URL(url).host;
  const headers = { Accept: 'application/json', ...(init.headers || {}) };
  if (!IS_BROWSER && CONFIG.userAgent) headers['User-Agent'] = CONFIG.userAgent;
  const base = { method: init.method || 'GET', headers };
  if (init.body != null) base.body = init.body;

  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`タイムアウト（${timeoutMs / 1000}秒）: ${host}`)), timeoutMs);
  });

  const doFetch = async (useSignal) => {
    const opts = { ...base };
    let ctrl;
    if (useSignal) {
      ctrl = new AbortController();
      opts.signal = ctrl.signal;
      if (init.signal) init.signal.addEventListener('abort', () => ctrl.abort(), { once: true });
      timeout.catch(() => ctrl.abort());
    }
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status} ${res.statusText} (${host})`);
      err.status = res.status;
      throw err;
    }
    return res.json();
  };

  try {
    if (!signalUnsupported) {
      try {
        return await Promise.race([doFetch(true), timeout]);
      } catch (e) {
        if (!isCloneError(e)) throw e;
        signalUnsupported = true; // 以降は signal を使わない
      }
    }
    return await Promise.race([doFetch(false), timeout]);
  } catch (e) {
    if (e.name === 'TypeError') throw new Error(`接続できません（${host}）: ${e.message}`);
    if (isCloneError(e)) throw new Error(`この画面では通信できません（${host}）。Safari や Chrome で開いてください`);
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function qs(params) {
  return new URLSearchParams(params).toString();
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** 2点間の距離（メートル） */
function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/** 同時実行数を制限して map する */
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

/** 名称比較用の正規化（空白・括弧書き・全角半角の揺れを除く） */
function normalizeName(s) {
  return String(s || '')
    .normalize('NFKC')
    .replace(/\s*[（(][^）)]*[）)]\s*/g, '') // 「八幡神社 (京都市)」→「八幡神社」
    .replace(/[\s・･]/g, '')
    .replace(/^宗教法人/, '')
    .toLowerCase();
}

// ─────────────────────────────────────────────
// 仕様1: Overpass API で神社・寺院を取得
// ─────────────────────────────────────────────
const RELIGION_REGEX = {
  all: '^(shinto|buddhist)$',
  shinto: '^shinto$',
  buddhist: '^buddhist$',
};

/** Overpass QL を組み立てる */
function buildOverpassQuery({ prefectureCode, around, kind = 'all', limit = 200 }) {
  const religion = RELIGION_REGEX[kind] || RELIGION_REGEX.all;
  const filter = `["amenity"="place_of_worship"]["religion"~"${religion}"]["name"]`;
  if (prefectureCode) {
    return [
      '[out:json][timeout:120];',
      `area["ISO3166-2"="${prefectureCode}"]["admin_level"="4"]->.pref;`,
      `nwr${filter}(area.pref);`,
      `out center tags ${limit};`,
    ].join('\n');
  }
  if (around) {
    const { lat, lon, radius } = around;
    return [
      '[out:json][timeout:60];',
      `nwr${filter}(around:${radius},${lat},${lon});`,
      `out center tags ${limit};`,
    ].join('\n');
  }
  throw new Error('prefectureCode か around のどちらかを指定してください');
}

/** Overpass に問い合わせる（混雑時は別サーバーに切り替え） */
async function runOverpass(query, { signal } = {}) {
  const errors = [];
  for (const endpoint of CONFIG.overpassEndpoints) {
    try {
      const json = await fetchJSON(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
        body: 'data=' + encodeURIComponent(query),
        signal,
        timeoutMs: CONFIG.overpassTimeoutMs,
      });
      if (json.remark && /runtime error|timed out/i.test(json.remark)) {
        throw new Error('Overpass: ' + json.remark);
      }
      return json.elements || [];
    } catch (e) {
      if (signal?.aborted) throw e;
      errors.push(e.message);
      // 429（混雑）/ 5xx / タイムアウトのときは次のサーバーへ
    }
  }
  throw new Error('Overpass API の全サーバーで失敗しました\n- ' + errors.join('\n- '));
}

/** OSM の addr:* タグから日本式の住所文字列を作る */
function addressFromTags(t = {}) {
  if (t['addr:full']) return t['addr:full'];
  const area = [
    t['addr:province'] || t['addr:state'],
    t['addr:county'],
    t['addr:city'],
    t['addr:suburb'],
    t['addr:quarter'],
    t['addr:neighbourhood'],
    t['addr:street'],
  ].filter(Boolean);
  const nums = [t['addr:block_number'], t['addr:housenumber']].filter(Boolean).join('-');
  // 都道府県だけ、のような粗い住所は「住所なし」として扱う
  if (area.length < 2 && !nums) return null;
  return dedupeJoin(area) + nums;
}

function dedupeJoin(parts) {
  const out = [];
  for (const p of parts) if (out[out.length - 1] !== p) out.push(p);
  return out.join('');
}

// OSM の denomination タグ → 日本語の宗派名（Wikidata で取れないときの予備）
const DENOMINATION_JA = {
  jodo_shinshu: '浄土真宗', shin: '浄土真宗', jodo: '浄土宗', pure_land: '浄土宗',
  shingon: '真言宗', tendai: '天台宗', nichiren: '日蓮宗', soto: '曹洞宗',
  rinzai: '臨済宗', obaku: '黄檗宗', zen: '禅宗', ji: '時宗', kegon: '華厳宗',
  hosso: '法相宗', ritsu: '律宗', yuzu_nembutsu: '融通念仏宗', shugendo: '修験道',
  mahayana: '大乗仏教', jinja_honcho: '神社本庁',
};

/** Overpass の要素をアプリで扱いやすい形にそろえる */
function normalizeElement(el, origin) {
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat;
  const lon = el.lon ?? el.center?.lon;
  const place = {
    id: `${el.type}/${el.id}`,
    osmUrl: `https://www.openstreetmap.org/${el.type}/${el.id}`,
    name: t['name:ja'] || t.name,
    kana: t['name:ja-Hira'] || t['name:ja_kana'] || t['name:ja-Kana'] || null,
    religion: t.religion, // 'shinto' | 'buddhist'
    type: t.religion === 'shinto' ? '神社' : '寺院',
    lat,
    lon,
    address: addressFromTags(t),
    addressSource: null,
    postcode: t['addr:postcode'] || null,
    denomination: t.denomination
      ? DENOMINATION_JA[t.denomination] || t.denomination
      : null,
    wikidata: t.wikidata || null,
    wikipedia: t.wikipedia || null, // 例: "ja:清水寺"
    website: t.website || t['contact:website'] || null,
    distance: null,
    wiki: null, // enrichPlace() で埋まる
    tags: t,
  };
  if (place.address) place.addressSource = 'osm';
  if (origin && lat != null) place.distance = Math.round(distanceMeters(origin.lat, origin.lon, lat, lon));
  return place;
}

/**
 * 都道府県内の神社・寺院を取得
 * @param {string|number} prefecture '京都府' / '京都' / 26 / 'JP-26'
 * @param {{kind?: 'all'|'shinto'|'buddhist', limit?: number, signal?: AbortSignal}} opts
 */
async function searchTemplesByPrefecture(prefecture, { kind = 'all', limit = 200, signal } = {}) {
  const pref = resolvePrefecture(prefecture);
  if (!pref) throw new Error(`都道府県が見つかりません: ${prefecture}`);
  const query = buildOverpassQuery({ prefectureCode: pref.code, kind, limit });
  const elements = await runOverpass(query, { signal });
  return elements
    .map((el) => normalizeElement(el))
    .filter((p) => p.name && p.lat != null)
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
}

/**
 * 緯度経度の周辺にある神社・寺院を取得（近い順）
 * @param {number} lat
 * @param {number} lon
 * @param {{radius?: number, kind?: 'all'|'shinto'|'buddhist', limit?: number, signal?: AbortSignal}} opts radius はメートル
 */
async function searchTemplesNearby(lat, lon, { radius = 1000, kind = 'all', limit = 100, signal } = {}) {
  lat = Number(lat);
  lon = Number(lon);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('緯度・経度が正しくありません');
  radius = Math.min(Math.max(Number(radius) || 1000, 50), 20000);
  const query = buildOverpassQuery({ around: { lat, lon, radius }, kind, limit });
  const elements = await runOverpass(query, { signal });
  return elements
    .map((el) => normalizeElement(el, { lat, lon }))
    .filter((p) => p.name && p.lat != null)
    .sort((a, b) => a.distance - b.distance);
}

// ─────────────────────────────────────────────
// 住所の補完（Nominatim 逆ジオコーディング・1秒1件）
// ─────────────────────────────────────────────
const nominatimCache = new Map();
let nominatimQueue = Promise.resolve();

function addressFromNominatim(a = {}) {
  const area = [
    a.province || a.state,
    a.county,
    a.city || a.town || a.village,
    a.city_district,
    a.suburb,
    a.quarter,
    a.neighbourhood,
    a.hamlet,
  ].filter(Boolean);
  if (!area.length) return null;
  return dedupeJoin(area) + (a.house_number || '');
}

/** 緯度経度 → 住所（キャッシュ・間隔制御つき） */
function reverseGeocode(lat, lon) {
  const key = `${lat.toFixed(5)},${lon.toFixed(5)}`;
  if (nominatimCache.has(key)) return nominatimCache.get(key);
  const job = nominatimQueue.then(async () => {
    const url =
      CONFIG.nominatimEndpoint +
      '?' +
      qs({ format: 'jsonv2', lat, lon, zoom: 18, addressdetails: 1, 'accept-language': 'ja' });
    try {
      const json = await fetchJSON(url);
      return addressFromNominatim(json.address);
    } finally {
      await sleep(CONFIG.nominatimIntervalMs);
    }
  });
  nominatimQueue = job.catch(() => {});
  nominatimCache.set(key, job);
  return job;
}

/**
 * address が空の施設だけ Nominatim で住所を補完する（元の配列を書き換えて返す）
 * 1秒1件なので max 件までに制限している
 */
async function fillMissingAddresses(places, { max = 30, onProgress } = {}) {
  const targets = places.filter((p) => !p.address).slice(0, max);
  let done = 0;
  for (const p of targets) {
    try {
      const addr = await reverseGeocode(p.lat, p.lon);
      if (addr) {
        p.address = addr;
        p.addressSource = 'nominatim';
      }
    } catch (e) {
      p.addressError = e.message;
    }
    onProgress?.(++done, targets.length, p);
  }
  return places;
}

// ─────────────────────────────────────────────
// 仕様2: Wikipedia / Wikidata で概要文・宗派を補完
// ─────────────────────────────────────────────
const MATCH_RADIUS_M = 3000; // 名前が合っていても、この距離より離れていれば別の寺社とみなす
const wikidataLabelCache = new Map();

async function wikipediaQuery(params) {
  return fetchJSON(CONFIG.wikipediaApi + '?' + qs({ action: 'query', format: 'json', formatversion: 2, origin: '*', ...params }));
}

async function wikidataQuery(params) {
  return fetchJSON(CONFIG.wikidataApi + '?' + qs({ format: 'json', origin: '*', ...params }));
}

/** 名称が一致しているか（完全一致 / 片方がもう片方を含む） */
function nameMatchLevel(placeName, pageTitle) {
  const a = normalizeName(placeName);
  const b = normalizeName(pageTitle);
  if (!a || !b) return 0;
  if (a === b) return 2;
  if (a.length >= 3 && b.length >= 3 && (a.includes(b) || b.includes(a))) return 1;
  return 0;
}

/** ① 座標の近くにある Wikipedia 記事から名前の合うものを探す（同名寺社の取り違えが起きにくい） */
async function findByGeosearch(place) {
  const json = await wikipediaQuery({
    list: 'geosearch',
    gscoord: `${place.lat}|${place.lon}`,
    gsradius: 1000,
    gslimit: 50,
  });
  const hits = (json.query?.geosearch || [])
    .map((g) => ({ title: g.title, dist: g.dist, level: nameMatchLevel(place.name, g.title) }))
    .filter((g) => g.level > 0)
    .sort((x, y) => y.level - x.level || x.dist - y.dist);
  return hits[0] ? { title: hits[0].title, matchedBy: 'geosearch', confidence: 'high', dist: Math.round(hits[0].dist) } : null;
}

/** ② 名前で全文検索し、記事の座標が近いものを採用する */
async function findByTextSearch(place) {
  const json = await wikipediaQuery({
    generator: 'search',
    gsrsearch: place.name,
    gsrlimit: 10,
    gsrnamespace: 0,
    prop: 'coordinates',
    colimit: 'max',
  });
  const pages = json.query?.pages || [];
  let best = null;
  for (const pg of pages) {
    const level = nameMatchLevel(place.name, pg.title);
    if (!level) continue;
    const c = pg.coordinates?.[0];
    if (c) {
      const dist = distanceMeters(place.lat, place.lon, c.lat, c.lon);
      if (dist > MATCH_RADIUS_M) continue; // 同名の別の寺社
      const cand = { title: pg.title, matchedBy: 'search+coords', confidence: level === 2 ? 'high' : 'medium', dist: Math.round(dist), score: level * 10 - dist / 1000 };
      if (!best || cand.score > best.score) best = cand;
    } else if (level === 2 && !best) {
      // 記事に座標が無い場合は名前の完全一致のみ・信頼度 low
      best = { title: pg.title, matchedBy: 'search(name only)', confidence: 'low', dist: null, score: 0 };
    }
  }
  if (best) delete best.score;
  return best;
}

/** Wikipedia 記事の概要文と Wikidata ID を取得 */
async function fetchWikipediaPage(title) {
  const json = await wikipediaQuery({
    titles: title,
    redirects: 1,
    prop: 'extracts|pageprops|info',
    exintro: 1,
    explaintext: 1,
    ppprop: 'wikibase_item|disambiguation',
    inprop: 'url',
  });
  const pg = json.query?.pages?.[0];
  if (!pg || pg.missing) return null;
  if (pg.pageprops && 'disambiguation' in pg.pageprops) return null; // 曖昧さ回避ページは使わない
  return {
    title: pg.title,
    url: pg.fullurl || `https://ja.wikipedia.org/wiki/${encodeURIComponent(pg.title)}`,
    summary: (pg.extract || '').trim() || null,
    qid: pg.pageprops?.wikibase_item || null,
  };
}

/** Wikidata の項目から日本語版 Wikipedia のタイトルと宗派(P140)を取得 */
async function fetchWikidataInfo(qid) {
  const json = await wikidataQuery({
    action: 'wbgetentities',
    ids: qid,
    props: 'claims|sitelinks',
    sitefilter: 'jawiki',
  });
  const ent = json.entities?.[qid];
  if (!ent || ent.missing !== undefined) return null;
  const sectIds = (ent.claims?.P140 || [])
    .map((c) => c.mainsnak?.datavalue?.value?.id)
    .filter(Boolean);
  return {
    jawikiTitle: ent.sitelinks?.jawiki?.title || null,
    sect: await getWikidataLabels(sectIds),
  };
}

/** Wikidata の Q番号 → 日本語ラベル（無ければ英語） */
async function getWikidataLabels(ids) {
  const need = ids.filter((id) => !wikidataLabelCache.has(id));
  if (need.length) {
    const json = await wikidataQuery({ action: 'wbgetentities', ids: need.slice(0, 50).join('|'), props: 'labels', languages: 'ja|en' });
    for (const id of need) {
      const l = json.entities?.[id]?.labels;
      wikidataLabelCache.set(id, l?.ja?.value || l?.en?.value || id);
    }
  }
  return ids.map((id) => wikidataLabelCache.get(id));
}

/**
 * 1件の寺社に Wikipedia / Wikidata の情報を補完する
 * 結果は place.wiki に入る:
 *   { title, url, summary, qid, sect: string[], matchedBy, confidence, dist } または { notFound: true }
 */
async function enrichPlace(place) {
  let title = null;
  let qid = place.wikidata;
  let match = null;

  // 1) OSM に wikipedia / wikidata タグがあればそれを最優先（確実）
  if (place.wikipedia) {
    const m = place.wikipedia.match(/^ja:(.+)$/);
    if (m) {
      title = m[1];
      match = { matchedBy: 'osm:wikipedia', confidence: 'high' };
    }
  }
  let wd = null;
  if (!title && qid) {
    wd = await fetchWikidataInfo(qid);
    if (wd?.jawikiTitle) {
      title = wd.jawikiTitle;
      match = { matchedBy: 'osm:wikidata', confidence: 'high' };
    }
  }

  // 2) タグが無ければ、座標検索 → 名前検索 の順で探す
  if (!title && !qid) {
    match = (await findByGeosearch(place)) || (await findByTextSearch(place));
    title = match?.title || null;
  }

  let page = null;
  if (title) {
    page = await fetchWikipediaPage(title);
    if (page?.qid && !qid) qid = page.qid;
  }
  if (qid && !wd) wd = await fetchWikidataInfo(qid);

  if (!page && !wd) {
    place.wiki = { notFound: true };
    return place;
  }

  let sect = wd?.sect || [];
  // 神社の P140 は「神道」だけのことが多い。OSM の宗派タグがあれば補う
  if (place.denomination && !sect.includes(place.denomination)) sect = [...sect, place.denomination];

  place.wiki = {
    title: page?.title || null,
    url: page?.url || null,
    summary: page?.summary || null,
    qid: qid || null,
    wikidataUrl: qid ? `https://www.wikidata.org/wiki/${qid}` : null,
    sect,
    matchedBy: match?.matchedBy || 'osm:wikidata',
    confidence: match?.confidence || 'high',
    dist: match?.dist ?? null,
  };
  return place;
}

/** 複数件をまとめて補完（同時3件まで） */
async function enrichPlaces(places, { concurrency = 3, onProgress } = {}) {
  let done = 0;
  await mapLimit(places, concurrency, async (p) => {
    try {
      await enrichPlace(p);
    } catch (e) {
      p.wiki = { error: e.message };
    }
    onProgress?.(++done, places.length, p);
  });
  return places;
}


// ───────── テスト画面 ─────────
const $ = (id) => document.getElementById(id);
let mode = 'pref';
let places = [];
let busy = false;

$('pref').innerHTML = PREFECTURES.map((p) => `<option value="${p.code}">${p.name}</option>`).join('');
$('pref').value = 'JP-26';

$('tabPref').onclick = () => setMode('pref');
$('tabGeo').onclick = () => setMode('geo');
function setMode(m) {
  mode = m;
  $('tabPref').classList.toggle('on', m === 'pref');
  $('tabGeo').classList.toggle('on', m === 'geo');
  $('prefBox').hidden = m !== 'pref';
  $('geoBox').hidden = m !== 'geo';
}
document.querySelectorAll('[data-ll]').forEach((b) => {
  b.onclick = () => { const [la, lo] = b.dataset.ll.split(','); $('lat').value = la; $('lon').value = lo; };
});
$('here').onclick = () => {
  if (!navigator.geolocation) return status('この環境では位置情報が使えません');
  status('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(
    (pos) => { $('lat').value = pos.coords.latitude.toFixed(5); $('lon').value = pos.coords.longitude.toFixed(5); status('現在地をセットしました'); },
    (e) => status('現在地を取得できませんでした: ' + e.message),
  );
};

function status(msg, isErr = false) { $('status').textContent = msg; $('status').classList.toggle('err', isErr); }
status('準備OK。①検索を押してください');
function setBusy(b) {
  busy = b;
  $('btnSearch').disabled = b;
  $('btnAddr').disabled = b || !places.length;
  const missing = places.filter((p) => !p.address).length;
  $('btnAddr').textContent = places.length ? `② 住所を補完（住所なし${missing}件）` : '② 住所を補完';
  $('btnWiki').disabled = b || !places.length;
  $('btnCopy').disabled = b || !places.length;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

$('btnSearch').onclick = async () => {
  setBusy(true);
  const t0 = performance.now();
  const kind = $('kind').value;
  const limit = Number($('limit').value) || 50;
  const label = mode === 'pref' ? 'Overpass API に問い合わせ中…（都道府県全体は1〜2分かかることがあります）' : 'Overpass API に問い合わせ中…';
  const tick = setInterval(() => status(`${label} ${Math.round((performance.now() - t0) / 1000)}秒`), 1000);
  try {
    if (mode === 'pref') {
      places = await searchTemplesByPrefecture($('pref').value, { kind, limit });
    } else {
      places = await searchTemplesNearby($('lat').value, $('lon').value, { radius: Number($('radius').value), kind, limit });
    }
    clearInterval(tick);
    status(places.length
      ? `取得完了: ${places.length}件（${((performance.now() - t0) / 1000).toFixed(1)}秒）`
      : '0件でした。条件（半径・種別・都道府県）を変えて試してください。', !places.length);
  } catch (e) {
    clearInterval(tick);
    places = [];
    status('検索に失敗したため、②③に進めません。\n' + e.message + '\n\n対処: 少し待って再実行 / 最大件数を減らす / 「緯度経度の周辺」で試す', true);
  }
  render();
  setBusy(false);
};

$('btnAddr').onclick = async () => {
  setBusy(true);
  const missing = places.filter((p) => !p.address).length;
  if (!missing) { status('全件に住所が入っているので、補完は不要です。③に進めます'); setBusy(false); return; }
  const max = Math.min(missing, 30);
  status(`住所の無い ${missing}件のうち ${max}件を Nominatim で補完中…（1秒に1件）`);
  await fillMissingAddresses(places, { max, onProgress: (d, n) => { status(`住所を補完中… ${d}/${n}`); render(); } });
  status(`住所の補完が終わりました（残り住所なし: ${places.filter((p) => !p.address).length}件）`);
  render();
  setBusy(false);
};

$('btnWiki').onclick = async () => {
  setBusy(true);
  const targets = places.filter((p) => !p.wiki).slice(0, 30);
  status(`Wikipedia / Wikidata で ${targets.length}件を補完中…`);
  await enrichPlaces(targets, { onProgress: (d, n) => { status(`Wikipedia 補完中… ${d}/${n}`); render(); } });
  const rest = places.filter((p) => !p.wiki).length;
  status(`補完が終わりました${rest ? `（未処理 ${rest}件：もう一度押すと続きを処理します）` : ''}`);
  render();
  setBusy(false);
};

$('btnCopy').onclick = async () => {
  const data = places.map(({ tags, ...rest }) => rest);
  try { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); status('JSONをコピーしました'); }
  catch { status('コピーできませんでした（ブラウザの制限）'); }
};

function render() {
  const n = places.length;
  if (!n) { $('stats').textContent = ''; $('list').innerHTML = ''; return; }
  const withAddr = places.filter((p) => p.address).length;
  const enriched = places.filter((p) => p.wiki);
  const found = enriched.filter((p) => p.wiki && !p.wiki.notFound && !p.wiki.error).length;
  $('stats').innerHTML =
    `<b>${n}件</b>　神社 ${places.filter((p) => p.religion === 'shinto').length} ／ 寺院 ${places.filter((p) => p.religion === 'buddhist').length}` +
    `　｜ 住所あり ${withAddr}/${n}` +
    (enriched.length ? `　｜ Wikipedia ヒット ${found}/${enriched.length}` : '');

  $('list').innerHTML = places.map((p) => {
    const w = p.wiki;
    let wikiHtml = '';
    if (w?.error) wikiHtml = `<div class="wiki missing">補完エラー: ${esc(w.error)}</div>`;
    else if (w?.notFound) wikiHtml = `<div class="wiki">Wikipedia / Wikidata に該当なし</div>`;
    else if (w) {
      wikiHtml = `<div class="wiki">
        ${w.title ? `<b><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a></b>` : '<b>(日本語版記事なし)</b>'}
        <span class="conf ${w.confidence}">${w.confidence}</span>
        <span class="meta">${esc(w.matchedBy)}${w.dist != null ? ` / 記事座標まで ${w.dist}m` : ''}</span><br>
        <b>宗派:</b> ${w.sect?.length ? esc(w.sect.join('、')) : '<span class="missing">不明</span>'}
        ${w.qid ? ` <span class="meta">(<a href="${esc(w.wikidataUrl)}" target="_blank" rel="noopener">${esc(w.qid)}</a>)</span>` : ''}<br>
        ${w.summary ? esc(w.summary.length > 220 ? w.summary.slice(0, 220) + '…' : w.summary) : '<span class="missing">概要文なし</span>'}
      </div>`;
    }
    return `<div class="card">
      <h3><span class="badge ${esc(p.religion)}">${esc(p.type)}</span>${esc(p.name)}</h3>
      <div class="meta">
        ${p.kana ? esc(p.kana) + '<br>' : ''}
        📍 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}${p.distance != null ? `（${p.distance}m）` : ''}
        ・<a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=17/${p.lat}/${p.lon}" target="_blank" rel="noopener">地図</a>
        ・<a href="${esc(p.osmUrl)}" target="_blank" rel="noopener">OSM</a><br>
        🏠 ${p.address ? esc(p.address) + ` <span class="meta">[${p.addressSource}]</span>` : '<span class="missing">住所なし</span>'}
        ${p.denomination ? `<br>OSM宗派タグ: ${esc(p.denomination)}` : ''}
        ${p.wikidata || p.wikipedia ? `<br>OSMリンク: ${esc([p.wikipedia, p.wikidata].filter(Boolean).join(' / '))}` : ''}
      </div>
      ${wikiHtml}
      <details><summary>生データ</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>
    </div>`;
  }).join('');
}
